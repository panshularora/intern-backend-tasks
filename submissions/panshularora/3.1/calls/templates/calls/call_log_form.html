<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Edit{% else %}New{% endif %} Call Log</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>{% if object %}Edit Call Log #{{ object.pk }}{% else %}New Call Log{% endif %}</h1>
    <a href="{% url 'calls:list' %}">← Back to list</a>

    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}

        {% if form.errors %}
        <div class="error">
            <strong>Please fix the following errors:</strong>
            {{ form.errors }}
        </div>
        {% endif %}

        <button type="submit">{% if object %}Save Changes{% else %}Create Call Log{% endif %}</button>
        <a href="{% url 'calls:list' %}" style="margin-left: 12px;">Cancel</a>
    </form>
</body>
</html>
