<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Call Log</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        .warning { background: #fff3cd; border: 1px solid #ffc107; padding: 16px; border-radius: 6px; }
        button { padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Delete Call Log?</h1>
    <div class="warning">
        <p>Are you sure you want to delete the call log for:</p>
        <p><strong>{{ object }}</strong></p>
        <p>This action cannot be undone.</p>
    </div>

    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'calls:list' %}" style="margin-left: 12px;">Cancel</a>
    </form>
</body>
</html>
